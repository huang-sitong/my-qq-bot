[project]
name = "qq-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "dotenv>=0.9.9",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "langchain>=1.3.2",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.2",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "mcp>=1.24.0,<2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pillow>=12.3.0",
    "pydantic>=2.0.0",
    "jieba>=0.42.1",
    "milvus-lite>=3.2.0",
    "pymilvus>=3.0.1",
    "uvicorn>=0.51.0",
    "websockets>=16.1",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta:__legacy__"

[tool.setuptools.packages.find]
include = ["object*", "bot*"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]